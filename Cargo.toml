[package]
name = "com-port-watcher-rs"
version = "0.4.0"
edition = "2021"
description = "Native Rust prototype of the COM Port Watcher tray utility (Windows / Linux / macOS)"
license = "MIT"

[features]
default = ["tray"]
# The tray pulls in tao + tray-icon (and, on Linux, GTK/AppIndicator
# system libraries). Build with --no-default-features for a headless
# watcher (log + notifications) with no GUI system dependencies.
# v0.2.0 adds the custom popup surface: softbuffer presents a
# hand-rendered framebuffer in a tao window, fontdue rasterizes the
# text, arboard does click-to-copy.
tray = ["dep:tray-icon", "dep:tao", "dep:softbuffer", "dep:fontdue", "dep:arboard", "dep:x11rb"]

[dependencies]
serialport = "4"
notify-rust = "4"
tray-icon = { version = "0.19", optional = true }
tao = { version = "0.32", optional = true }
softbuffer = { version = "0.4", optional = true }
fontdue = { version = "0.9", optional = true }
arboard = { version = "3", optional = true, features = ["wayland-data-control"] }
# Linux popup backend: raw X11 windows (no toolkit in between).
# Optional like the other tray deps; only referenced on Linux.
x11rb = { version = "0.13", optional = true }

# Windows-only: AppUserModelID registration (process AUMID, registry
# DisplayName/IconUri, Start Menu shortcut) in src/appid.rs. Version
# 0.62 matches what notify-rust 4.18's toast backend already pulls in,
# so it adds no new crates to the tree.
# Unix-only: fork/setsid for the tray mode's self-detach into the
# background (src/main.rs daemonize()). Already in the tree via
# serialport, so it adds no new crates.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Registry",
    "Win32_System_Variant",
    "Win32_UI_Shell",
    "Win32_UI_Shell_PropertiesSystem",
] }

[profile.release]
strip = true
lto = true
codegen-units = 1
opt-level = 3
